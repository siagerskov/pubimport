name: PubMed to Zotero
on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pubmed-sync.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'offline, dry-run eller import'
        type: choice
        options: [offline, dry-run, apply]
        default: dry-run
      limit:
        description: 'Max träffar per sökning, eller all'
        type: string
        default: 'all'
      max_imports:
        description: 'Max nya referenser i batchen'
        type: string
        default: '20'
      confirm_library:
        description: 'Biblioteks-ID, krävs endast för godkänd apply'
        type: string
        default: ''
# Daglig import godkänd 2026-11-02: 05:23 UTC, högst tjugo nya per körning.
permissions:
  contents: read
concurrency:
  group: pubmed-zotero-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: zotero-production
    outputs:
      import_summary: ${{ steps.import_run.outputs.import_summary }}
      run_mode: ${{ steps.import_run.outputs.run_mode }}
      tag_fix: ${{ steps.tag_fix.outputs.tag_fix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - run: uv run pytest
      - name: Correct explicitly approved pilot tag once
        id: tag_fix
        if: github.event_name == 'push' && github.event.head_commit.message == 'Enable approved daily import and fix pilot tag 2026-11-02' && github.run_attempt == 1
        env:
          APPROVED_TAG_FIX: 42960128-godkand
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ vars.ZOTERO_LIBRARY_ID }}
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE || 'user' }}
        run: uv run python scripts/fix_approved_tag.py
      - name: Run selected mode
        id: import_run
        env:
          SYNC_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'Enable approved daily import and fix pilot tag 2026-11-02' && github.run_attempt == 1)) && 'apply' || inputs.mode || 'dry-run' }}
          SYNC_LIMIT: ${{ inputs.limit || 'all' }}
          SYNC_BATCH: 'true'
          MAX_IMPORTS: ${{ inputs.max_imports || '20' }}
          CONFIRM_LIBRARY: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && vars.ZOTERO_LIBRARY_ID || inputs.confirm_library }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ vars.ZOTERO_LIBRARY_ID }}
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE || 'user' }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: uv run python scripts/run_sync.py

  publish-status:
    needs: sync
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish counters to isolated status branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_RESULT: ${{ needs.sync.result }}
          RUN_MODE: ${{ needs.sync.outputs.run_mode }}
          IMPORT_SUMMARY: ${{ needs.sync.outputs.import_summary }}
          TAG_FIX_RESULT: ${{ needs.sync.outputs.tag_fix }}
        run: python scripts/publish_status.py
