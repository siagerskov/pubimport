name: PubMed to Zotero
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'offline, dry-run mot API, eller godkänd pilotimport'
        type: choice
        options: [offline, dry-run, apply]
        default: offline
      limit:
        description: 'Max träffar per sökning (pilot)'
        type: string
        default: '5'
      max_imports:
        description: 'Max nya poster före avbrott'
        type: string
        default: '10'
      confirm_library:
        description: 'Biblioteks-ID, krävs endast för godkänd apply'
        type: string
        default: ''
# Daglig drift är avsiktligt inte aktiverad. Efter godkänd pilot:
# lägg till schedule under on enligt docs/07-drift-underhall.md.
permissions:
  contents: read
concurrency:
  group: pubmed-zotero-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: zotero-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - name: Run selected mode
        env:
          SYNC_MODE: ${{ inputs.mode || 'dry-run' }}
          SYNC_LIMIT: ${{ inputs.limit || '5' }}
          MAX_IMPORTS: ${{ inputs.max_imports || '10' }}
          CONFIRM_LIBRARY: ${{ inputs.confirm_library }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ vars.ZOTERO_LIBRARY_ID }}
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE || 'user' }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: uv run python scripts/run_sync.py
