name: Automatic approval tags
on:
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/review-status.yml', 'scripts/reconcile_reviews.py', 'src/pubmed_zotero/reviews.py']
permissions:
  contents: read
concurrency:
  group: pubmed-zotero-production
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: zotero-production
    outputs:
      import_summary: ${{ steps.reviews.outputs.import_summary }}
      run_mode: ${{ steps.reviews.outputs.run_mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - run: uv run pytest
      - name: Apply collection-driven approval updates
        id: reviews
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ vars.ZOTERO_LIBRARY_ID }}
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE || 'user' }}
        run: uv run python scripts/reconcile_reviews.py --apply
  publish-status:
    needs: review
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_RESULT: ${{ needs.review.result }}
          IMPORT_SUMMARY: ${{ needs.review.outputs.import_summary }}
          RUN_MODE: ${{ needs.review.outputs.run_mode }}
          STATUS_KIND: review
        run: python scripts/publish_status.py
