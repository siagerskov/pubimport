name: Read-only pilot diagnosis
# Includes key permission metadata, never credential values.
# Recheck corrected approval tag and cleared inbox subcollections, 2026-11-02.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pilot-check.yml']
permissions:
  contents: read
concurrency:
  group: pubmed-zotero-production
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: zotero-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - run: uv run pytest
      - name: Inspect imported pilot without writes
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ vars.ZOTERO_LIBRARY_ID }}
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE || 'user' }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: uv run python scripts/check_pilot.py
