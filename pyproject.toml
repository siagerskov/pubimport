[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pubmed-zotero"
version = "0.2.0"
description = "PubMed monitoring with reviewable Zotero import plans"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3", "defusedxml==0.7.1"]

[project.scripts]
pubmed-zotero = "pubmed_zotero.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
